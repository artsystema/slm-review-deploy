---
deployment:
  tasks:
    - /usr/bin/test -d "$HOME/public_html/slm.artsystema.com"
    - /usr/bin/test -f "$HOME/public_html/slm.artsystema.com/app-root.php"
    - /usr/bin/test -f "$HOME/public_html/slm-review/private/config.php"
    - /usr/bin/test -f "deploy/deny-web-access.htaccess"
    - /bin/mkdir -p "$HOME/public_html/slm-review/app" "$HOME/public_html/slm-review/migrations" "$HOME/public_html/slm-review-storage" "$HOME/public_html/slm.artsystema.com/assets"
    - /bin/cp -R app/. "$HOME/public_html/slm-review/app/"
    - /bin/cp -R migrations/. "$HOME/public_html/slm-review/migrations/"
    - /bin/cp -R public/assets/. "$HOME/public_html/slm.artsystema.com/assets/"
    - /bin/cp public/index.php "$HOME/public_html/slm.artsystema.com/index.php"
    - /bin/cp deploy/deny-web-access.htaccess "$HOME/public_html/slm-review/.htaccess"
    - /bin/cp deploy/deny-web-access.htaccess "$HOME/public_html/slm-review-storage/.htaccess"
